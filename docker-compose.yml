version: '3.8'

# Expense Tracker – local deployment stack
# Starts n8n (workflow engine) and Ollama (local LLM for OCR + AI agent).
# The actual workflow is then uploaded via the Kotlin client
# (n8n-api-client) via API to this n8n. See README.md.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=<your url>
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - NODE_FUNCTION_ALLOW_EXTERNAL=better-sqlite3
      - NODE_PATH=/usr/local/lib/node_modules
    volumes:
      - n8n_data:/home/node/.n8n
      - expense_tracker_data:/home/node/.n8n/expenseTracker
    depends_on:
      - ollama
    networks:
      - expense-tracker-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - expense-tracker-net
    # GPU acceleration (optional, requires NVIDIA Container Toolkit).
    # If no GPU is available, remove this block – Ollama will then
    # run on CPU (slower, but functional).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  proxy-net:
    external: true

volumes:
  n8n_data:
  ollama_data:
